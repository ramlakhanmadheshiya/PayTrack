name: Secret audit

# Run by hand (Actions tab › Secret audit › Run workflow). Scans the FULL git
# history of every public repository of the account, and this repository, for
# keys, tokens, passwords and private files (Android keystores, .env, .pem…).
# Secrets are never printed (gitleaks --redact). The log stays in this private repo.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          path: self

      - name: Install gitleaks
        run: |
          v=8.28.0
          curl -fsSL -o /tmp/gl.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${v}/gitleaks_${v}_linux_x64.tar.gz"
          tar -xzf /tmp/gl.tgz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/
          gitleaks version

      - name: Scan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          owner="${GITHUB_REPOSITORY%%/*}"
          repos=$(gh repo list "$owner" --limit 200 --visibility public --json name,isFork -q '.[] | select(.isFork == false) | .name')
          total=0
          mkdir -p scan
          scan_one() {
            name="$1"; dir="$2"
            n=0
            if gitleaks git "$dir" --redact --no-banner --report-format json --report-path "scan/$name.json" > /dev/null 2>&1; then :; fi
            if [ -s "scan/$name.json" ]; then
              n=$(python3 -c "import json,sys;print(len(json.load(open('scan/$name.json'))))")
            fi
            files=$(git -C "$dir" log --all --pretty=format: --name-only | sort -u | grep -iE '\.(jks|keystore|p12|pfx|pem|key|ppk|mobileprovision)$|(^|/)\.env(\.|$)|google-services\.json|GoogleService-Info\.plist|id_rsa|credentials' || true)
            if [ "$n" = "0" ] && [ -z "$files" ]; then
              echo "CLEAN   $name"
            else
              echo "CHECK   $name: $n possible secrets"
              if [ "$n" != "0" ]; then
                python3 - "$name" <<'PY'
          import json, sys
          for f in json.load(open("scan/%s.json" % sys.argv[1])):
              print("        - %s  %s:%s  commit %s  (%s)" % (f.get("RuleID"), f.get("File"), f.get("StartLine"), f.get("Commit", "")[:8], f.get("Date", "")[:10]))
          PY
              fi
              if [ -n "$files" ]; then
                echo "        files that look private (ever in history):"
                echo "$files" | sed 's/^/          /'
              fi
            fi
          }
          scan_one "PayTrack(private)" self
          for r in $repos; do
            git clone -q --mirror "https://github.com/$owner/$r.git" "src/$r" || { echo "CLONE FAILED $r"; continue; }
            scan_one "$r" "src/$r"
          done
