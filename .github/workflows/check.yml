name: Verify PayTrack Web
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned official Godot
        run: |
          mkdir -p .tools
          curl -fL https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o .tools/godot.zip
          unzip -q .tools/godot.zip -d .tools
          chmod +x .tools/Godot_v4.7.2-stable_linux.x86_64
      - name: Import and test
        run: |
          .tools/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --editor --quit
          .tools/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script tests/run_tests.gd
      - name: Export static Web runtime
        run: |
          python3 tools/fetch_web_templates.py
          mkdir -p build/web
          .tools/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --export-release Web build/web/index.html
          python3 tools/verify_export.py
      - uses: actions/upload-artifact@v4
        with:
          name: paytrack-web
          path: build/web/
          retention-days: 7
